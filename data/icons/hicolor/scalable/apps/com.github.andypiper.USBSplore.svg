<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3584e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c71d8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>

  <!-- USB Symbol -->
  <!-- Central vertical line -->
  <line x1="64" y1="40" x2="64" y2="85" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Top circle -->
  <circle cx="64" cy="35" r="5" fill="white"/>

  <!-- Left branch with circle -->
  <line x1="64" y1="55" x2="50" y2="45" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <circle cx="48" cy="43" r="4" fill="white"/>

  <!-- Right branch with square -->
  <line x1="64" y1="55" x2="78" y2="45" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <rect x="76" y="39" width="6" height="6" fill="white"/>

  <!-- Bottom arrow/triangle -->
  <path d="M 64 85 L 58 75 L 70 75 Z" fill="white"/>

  <!-- USB connector base -->
  <rect x="56" y="90" width="16" height="8" rx="2" fill="white"/>
  <rect x="58" y="98" width="12" height="6" fill="white"/>
</svg>
